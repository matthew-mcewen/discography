# Full local / single-droplet stack: Postgres + one-shot migrator + bot + API.
# Copy .env.example to .env and fill it in first.
#
# The migrate service connects as the Postgres SUPERUSER to create tables; the
# bot and API connect as the non-superuser discography_app role (via DATABASE_URL
# in .env) so row-level security is enforced.

services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build: .
    command: python -m db.migrate
    env_file: .env
    environment:
      # Superuser DSN — needs table-creation privileges.
      DATABASE_URL: ${MIGRATION_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    command: python main.py
    env_file: .env
    environment:
      # App role DSN (non-superuser) — subject to RLS.
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
