channels:
  submissions: 1512100442279252242        # Channel ID to monitor for image posts
  announcements: 1501561314621919353      # Channel ID for winner announcements
  bot_commands: 1498591942626381982       # Channel ID where users can run bot commands
  leaderboard: 1501561314621919353        # Channel ID where the pinned leaderboard embed lives
  reaction_roles: 0                       # Channel ID where the reaction-roles panel embed lives (0 = disabled)
  guess_output: 0                         # Channel ID where /guess submissions are posted for judging (0 = disabled).
                                          # Make this channel visible only to the guess_judge role via Discord permissions.

roles:
  notification: 1521601957322686485       # Role ID pinged on winner announcements
  dry_run_admin: 1503349513237303377      # Role ID allowed to use /dryrun-* commands
  point_awarder: 1503349513237303377                        # Role ID allowed to use /awardpoints (0 = disabled)
  predict_starter: 1503349513237303377                      # Role ID allowed to use /createpredict and /finishpredict (0 = disabled)
  reaction_role_admin: 1503349513237303377                                     # Role ID allowed to use /reactionrole-* commands (0 = disabled)
  guess_judge: 1503349513237303377                                             # Role ID that judges /guess (sees guess_output, reacts 🥇🥈🥉, runs /guess-start and /guess-count) (0 = disabled)
  landing_rate_outcome: 1503349513237303377                                    # Role ID allowed to run /landing-rate-outcome (0 = disabled)

points:
  name: "BasicMiles"
  emoji: "🏆"           # Unicode emoji or Discord custom emote string e.g. <:star:123456789>

competition:
  # "dedicated" - full feature set: invalid posts are rejected, valid posts are
  #               deleted and reposted as a voting embed, only the vote emote
  #               is allowed to remain on it. Best for larger servers with a
  #               channel dedicated solely to submissions.
  # "basic"     - lightweight mode for smaller servers: the vote emote is added
  #               directly to single-image posts in the submissions channel.
  #               The original message and any other reactions are left alone;
  #               messages with zero or multiple images are silently ignored.
  mode: dedicated

coinflip:
  max_daily_flips: 3                     # Maximum coin flips per user per day (UTC)

predictions:
  # Virtual liquidity seeded on each outcome for dynamic odds. With no bets
  # placed yet, both outcomes start at decimal odds of 2.0. Larger values make
  # the odds drift more slowly as wagers come in. Must be > 0.
  seed_liquidity: 100

# Optional: award a points multiplier to users with specific roles.
# If a user has multiple matching roles, the highest multiplier wins.
# multiplyPoints:
#   - role: 123456789012345678   # Server Booster role ID
#     multiplier: 1.5
#   - role: 987654321098765432   # VIP role ID
#     multiplier: 2.0
