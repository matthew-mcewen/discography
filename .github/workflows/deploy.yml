name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd ~/discography
            git pull origin main
            .venv/bin/pip install -r requirements.txt --quiet
            # Apply DB migrations (advisory-locked; DSN must be able to CREATE TABLE).
            .venv/bin/python -m db.migrate
            # Restart both processes (see deploy/*.service and DEPLOY.md).
            systemctl --user restart discography-bot discography-api
